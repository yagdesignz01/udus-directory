<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Department of Computing</title>
<!-- Load the fonts used by this page. -->
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap"
  rel="stylesheet"
>
<style>
  /* These colours are reused throughout the login page. */
  :root {
    --udus-green: #008001;
    --udus-dark-green: #005A01;
    --udus-plum: #9F4A71;
    --surface: #F4F9EE;
    --white: #FFFFFF;
    --text-dark: #12233F;
    --text-muted: #6B7A94;
    --hairline: #E1E5EC;
  }
  
  /* Center the login card on the page. */
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: var(--text-dark);
    padding: 20px; 
    box-sizing: border-box;
  }

  /* White box that contains the admin login form. */
  .login-container {
    background: var(--white);
    padding: 40px 30px; 
    border-radius: 20px;
    box-shadow: 0 10px 40px -10px rgba(0, 90, 1, 0.15);
    width: 100%;
    max-width: 400px;
    text-align: center;
    border: 1px solid var(--hairline);
    box-sizing: border-box;
  }

  .brand-mark {
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }

  /* Keep the logo size in CSS instead of putting it inside the HTML tag. */
  .udus-logo {
    width: 65px;
    height: 65px;
    margin-bottom: 16px;
    object-fit: contain;
  }

  h1 {
    font-size: 22px;
    font-weight: 800;
    color: var(--udus-dark-green);
    margin: 0 0 8px;
  }

  p {
    font-size: 14px;
    color: var(--text-muted);
    margin: 0 0 24px;
  }

  /* Keep labels and inputs together. */
  .form-group {
    text-align: left;
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .form-group input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--hairline);
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    box-sizing: border-box;
    transition: border-color 0.2s;
  }

  .form-group input:focus {
    outline: none;
    border-color: var(--udus-green);
  }

  /* Main button used to submit the login form. */
  .btn {
    width: 100%;
    padding: 14px;
    background: var(--udus-green);
    color: var(--white);
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s;
  }

  .btn:hover {
    background: var(--udus-dark-green);
  }

  /* Error message sent by Django after a failed login. */
  .error-message {
    background: #FFF0F0;
    color: #D32F2F;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<div class="login-container">
  <!-- The local UDUS logo identifies this login page. -->
  <div class="brand-mark">
    <img src="{% static 'images/udus_logo.png' %}" alt="UDUS Logo" class="udus-logo">
  </div>
  <h1>Admin Gateway</h1>
  <p>Secure access for Super Administrators.</p>

  <!-- Django displays login errors here when the view sends a message. -->
  {% if messages %}
    {% for message in messages %}
      <div class="error-message">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <!-- Send the form to the existing admin login view. -->
  <form method="POST" action="{% url 'admin_login' %}">
    <!-- Protect the form from unwanted requests. -->
    {% csrf_token %}

    <div class="form-group">
      <label>Email Address</label>
      <input
        type="email"
        name="email"
        placeholder="admin@udus.edu.ng"
        required
      >
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        name="password"
        placeholder="••••••••"
        required
      >
    </div>

    <button type="submit" class="btn">Access Dashboard</button>
  </form>
</div>

</body>
</html>
